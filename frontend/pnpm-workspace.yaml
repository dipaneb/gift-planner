packages:
  - "."

allowBuilds:
  cypress: true
  esbuild: true
  maplibre-gl: true
  vue-demi: true
minimumReleaseAgeExclude:
  - "@vue/devtools-core@8.1.3"
  - "@vue/devtools-kit@8.1.3"
  - "@vue/devtools-shared@8.1.3"
  - vite-plugin-vue-devtools@8.1.3
onlyBuiltDependencies:
  - cypress
  - esbuild
overrides:
  # Security: transitive versions pinned by parents that lag behind the fixes
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
