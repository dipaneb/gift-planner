# Read by Nixpacks, which Dokploy uses to build and serve this frontend.
#
# Nixpacks serves Vite apps with Caddy and its own Caddyfile (stored as a "static asset").
# Static assets declared here replace the built-in ones, so this is the full Caddyfile:
# Nixpacks' default (same port, root, SPA fallback), plus security headers and caching.
# Source of the default: nixpacks src/providers/node/spa/Caddyfile.
#
# Test any change locally before pushing, a broken Caddyfile takes the site down:
#   caddy validate --adapter caddyfile --config <(the Caddyfile below)

[staticAssets]
Caddyfile = '''
{
	admin off
	persist_config off
	# HTTPS is terminated by Traefik in front of this container
	auto_https off
	log {
		format json
	}
	servers {
		trusted_proxies static private_ranges
	}
}

:{$PORT:3000} {
	log {
		format json
	}

	root * ../app/{$NIXPACKS_SPA_OUTPUT_DIR}
	encode gzip

	header {
		# Only ever reach the site over HTTPS (1 year)
		Strict-Transport-Security "max-age=31536000"
		# Only our own scripts, styles, fonts and images, and calls to our API.
		# style-src needs 'unsafe-inline': Vue and Nuxt UI set inline style attributes.
		# There is no inline script, so script-src stays strict: an injected <script> will not run.
		Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' {$API_ORIGIN:https://api.dipane.fr}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
		# No framing by other sites (clickjacking), for browsers that ignore frame-ancestors
		X-Frame-Options "DENY"
		X-Content-Type-Options "nosniff"
		# Reset and verification links carry their token in the URL: never send it elsewhere
		Referrer-Policy "no-referrer"
		Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
	}

	# Vite puts a content hash in every asset name: a changed file gets a new name,
	# so browsers can keep them forever.
	@hashed path /assets/*
	header @hashed Cache-Control "public, max-age=31536000, immutable"

	# index.html (and the SPA fallback to it) must always be revalidated,
	# otherwise visitors keep loading the previous version after a deploy.
	@not_hashed not path /assets/*
	header @not_hashed Cache-Control "no-cache"

	file_server
	try_files {path} /index.html
}
'''
